<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>J.A.R.V.I.S</title>
<style>
:root{--c:#4fe3ff;--c2:#1b8fb0;--dim:#0d3a4a;--bg:#01060b;--warn:#ffb020;--bad:#ff3b4e;--txt:#c9f6ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:"Rajdhani","Bahnschrift","Eurostile","Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;cursor:default}
body{background:radial-gradient(ellipse at 50% 55%,#06202c 0%,var(--bg) 65%)}
body::after{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:.25;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(79,227,255,.06) 3px 4px)}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;padding:1.5vmin 2.5vmin;grid-gap:1vmin}
header,footer{display:flex;align-items:center;justify-content:space-between;
  letter-spacing:.25em;font-size:2.4vmin;text-transform:uppercase}
header{border-bottom:1px solid var(--dim);padding-bottom:1vmin}
.title{color:var(--c);font-weight:700;font-size:3vmin;text-shadow:0 0 12px var(--c)}
#clock{font-size:3.6vmin;letter-spacing:.15em;color:#fff;font-variant-numeric:tabular-nums}
#link{display:flex;align-items:center}#link i{margin-right:1vmin}
#link i{width:1.4vmin;height:1.4vmin;border-radius:50%;background:var(--bad);box-shadow:0 0 8px currentColor}
#link.ok i{background:#3dffa0}#link.demo i{background:var(--warn)}
main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;grid-gap:2vmin;min-height:0}
.col{display:flex;flex-direction:column}.col .panel+.panel{margin-top:2vmin}
.panel{border:1px solid var(--dim);border-left:3px solid var(--c);padding:1.4vmin 1.8vmin;
  background:linear-gradient(90deg,rgba(79,227,255,.08),transparent);
  clip-path:polygon(0 0,calc(100% - 2vmin) 0,100% 2vmin,100% 100%,0 100%)}
.col.r .panel{border-left:1px solid var(--dim);border-right:3px solid var(--c);text-align:right;
  background:linear-gradient(270deg,rgba(79,227,255,.08),transparent);
  clip-path:polygon(2vmin 0,100% 0,100% 100%,0 100%,0 2vmin)}
.panel .lbl{font-size:1.9vmin;letter-spacing:.3em;color:var(--c2)}
.panel .val{font-size:5.4vmin;font-weight:600;color:#fff;line-height:1.1;font-variant-numeric:tabular-nums}
.panel .val small{font-size:2.2vmin;color:var(--c2);margin-left:.6vmin;letter-spacing:.1em}
.bar{height:.9vmin;background:var(--dim);margin-top:.8vmin;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .25s linear}
.col.r .bar b{margin-left:auto}
.panel.warn{border-color:var(--warn)}.panel.warn .val{color:var(--warn)}.panel.warn .bar b{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.panel.bad{border-color:var(--bad);animation:blink 1s steps(2) infinite}.panel.bad .val{color:var(--bad)}.panel.bad .bar b{background:var(--bad);box-shadow:0 0 10px var(--bad)}
@keyframes blink{50%{background:rgba(255,59,78,.18)}}
#gauge{width:60vh;height:60vh;display:block}
.spin{transform-origin:300px 300px;animation:spin 40s linear infinite}
.spin.rev{animation-duration:26s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
svg text{fill:var(--txt);font-family:inherit}
#spd{font-size:150px;font-weight:700;fill:#fff}
footer{border-top:1px solid var(--dim);padding-top:1vmin}footer>*+*{margin-left:2vmin}
#log{flex:1;min-width:0;color:var(--c);letter-spacing:.12em;text-transform:none;font-size:2.5vmin;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log::before{content:"JARVIS › ";color:var(--c2)}
.btn,#trip{white-space:nowrap}
.btn{border:1px solid var(--c2);color:var(--c);padding:.6vmin 1.6vmin;font-size:2vmin;letter-spacing:.2em}
.btn.off{color:var(--c2);border-color:var(--dim)}
#boot{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:opacity .8s}
#boot p{margin-top:4vmin}
#boot.gone{opacity:0;pointer-events:none}
#boot .core{width:26vmin;height:26vmin;border-radius:50%;border:.6vmin solid var(--c);
  box-shadow:0 0 6vmin var(--c),inset 0 0 6vmin var(--c);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.9);opacity:.6}}
#boot p{letter-spacing:.5em;color:var(--c);font-size:2.6vmin}
</style>
</head>
<body>
<div id="boot"><div class="core"></div><p>TOUCHER POUR INITIALISER</p></div>
<div id="app">
  <header>
    <span class="title">J.A.R.V.I.S</span>
    <span id="clock">--:--</span>
    <span id="link"><i></i><span id="linktxt">HORS LIGNE</span></span>
  </header>
  <main>
    <div class="col l">
      <div class="panel" id="p-coolant"><div class="lbl">TEMP. MOTEUR</div><div class="val"><span>--</span><small>°C</small></div><div class="bar"><b></b></div></div>
      <div class="panel" id="p-intake"><div class="lbl">ADMISSION</div><div class="val"><span>--</span><small>°C</small></div><div class="bar"><b></b></div></div>
      <div class="panel" id="p-load"><div class="lbl">CHARGE MOTEUR</div><div class="val"><span>--</span><small>%</small></div><div class="bar"><b></b></div></div>
    </div>
    <svg id="gauge" viewBox="0 0 600 600">
      <defs><radialGradient id="glow"><stop offset="0" stop-color="#4fe3ff" stop-opacity=".22"/><stop offset="1" stop-color="#4fe3ff" stop-opacity="0"/></radialGradient></defs>
      <circle cx="300" cy="300" r="200" fill="url(#glow)"/>
      <circle class="spin" cx="300" cy="300" r="292" fill="none" stroke="#1b8fb0" stroke-width="2" stroke-dasharray="2 14"/>
      <circle class="spin rev" cx="300" cy="300" r="196" fill="none" stroke="#1b8fb0" stroke-width="3" stroke-dasharray="60 20 8 20"/>
      <circle class="spin" cx="300" cy="300" r="182" fill="none" stroke="#0d3a4a" stroke-width="10" stroke-dasharray="4 8"/>
      <path id="rpmTrack" fill="none" stroke="#0d3a4a" stroke-width="16"/>
      <path id="rpmRed" fill="none" stroke="#ff3b4e" stroke-opacity=".35" stroke-width="16"/>
      <path id="rpmArc" fill="none" stroke="#4fe3ff" stroke-width="16" pathLength="100" stroke-dasharray="0 100"/>
      <path id="spdTrack" fill="none" stroke="#0d3a4a" stroke-width="5"/>
      <path id="spdArc" fill="none" stroke="#fff" stroke-width="5" pathLength="100" stroke-dasharray="0 100"/>
      <g id="ticks"></g>
      <text id="spd" x="300" y="335" text-anchor="middle">0</text>
      <text x="300" y="378" text-anchor="middle" font-size="24" letter-spacing="8" fill="#1b8fb0">KM/H</text>
      <text id="rpmTxt" x="300" y="440" text-anchor="middle" font-size="30" letter-spacing="3">---- TR/MIN</text>
      <text id="gear" x="300" y="182" text-anchor="middle" font-size="54" font-weight="700" fill="#4fe3ff"></text>
    </svg>
    <div class="col r">
      <div class="panel" id="p-fuel"><div class="lbl">CARBURANT</div><div class="val"><span>--</span><small>%</small></div><div class="bar"><b></b></div></div>
      <div class="panel" id="p-voltage"><div class="lbl">BATTERIE</div><div class="val"><span>--</span><small>V</small></div><div class="bar"><b></b></div></div>
      <div class="panel" id="p-throttle"><div class="lbl">ACCÉLÉRATEUR</div><div class="val"><span>--</span><small>%</small></div><div class="bar"><b></b></div></div>
    </div>
  </main>
  <footer>
    <span id="log">En attente d'initialisation.</span>
    <span id="trip">TRAJET 00:00:00</span>
    <span class="btn" id="voiceBtn">VOIX ON</span>
  </footer>
</div>
<script>
const Q = new URLSearchParams(location.search);
const VMAX = +Q.get('vmax') || 240, RPMMAX = +Q.get('rpmmax') || 7000, REDLINE = +Q.get('redline') || 6000;
const NATIVE = !!window.Android; // appli Android : donnees et voix fournies par le code natif
const DEMO = Q.has('demo') || (!NATIVE && location.protocol === 'file:');
const $ = id => document.getElementById(id);

// ---------- jauge centrale
function fit() { // en px : les vieux WebView Android n'ont ni min() ni aspect-ratio en CSS
  const s = Math.floor(Math.min(innerHeight * 0.72, innerWidth * 0.42)) + 'px';
  $('gauge').style.width = s; $('gauge').style.height = s;
}
addEventListener('resize', fit); fit();
const pt = (r, a) => { a = a * Math.PI / 180; return (300 + r * Math.sin(a)).toFixed(1) + ' ' + (300 - r * Math.cos(a)).toFixed(1); };
const arc = (r, a0, a1) => `M ${pt(r, a0)} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${pt(r, a1)}`;
const A0 = -135, A1 = 135;
$('rpmTrack').setAttribute('d', arc(264, A0, A1)); $('rpmArc').setAttribute('d', arc(264, A0, A1));
$('rpmRed').setAttribute('d', arc(264, A0 + 270 * REDLINE / RPMMAX, A1));
$('spdTrack').setAttribute('d', arc(232, A0, A1)); $('spdArc').setAttribute('d', arc(232, A0, A1));
let t = '';
for (let v = 0; v <= VMAX; v += 20) {
  const a = A0 + 270 * v / VMAX;
  t += `<path d="M ${pt(222, a)} L ${pt(212, a)}" stroke="#4fe3ff" stroke-width="2"/>`;
}
$('ticks').innerHTML = t;

// ---------- voix + journal
let voiceOn = true;
function say(text, speak = true) {
  $('log').textContent = text;
  if (!speak || !voiceOn) return;
  if (NATIVE) return Android.say(text);
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR'; u.pitch = 0.85; u.rate = 1.03;
  speechSynthesis.speak(u);
}
$('voiceBtn').onclick = () => {
  voiceOn = !voiceOn; if (!voiceOn) NATIVE ? Android.hush() : window.speechSynthesis && speechSynthesis.cancel();
  $('voiceBtn').textContent = voiceOn ? 'VOIX ON' : 'VOIX OFF'; $('voiceBtn').classList.toggle('off', !voiceOn);
};

// ---------- état
let S = {}, live = false, started = false, t0 = 0;
const shown = { speed: 0, rpm: 0 };
const PANELS = { // champ: [min, max, décimales, seuil alerte(v)->'warn'|'bad'|'']
  coolant: [40, 130, 0, v => v >= 110 ? 'bad' : v >= 102 ? 'warn' : ''],
  intake: [-10, 80, 0, v => v >= 65 ? 'warn' : ''],
  load: [0, 100, 0, () => ''],
  fuel: [0, 100, 0, v => v <= 7 ? 'bad' : v <= 15 ? 'warn' : ''],
  voltage: [10, 15, 1, v => v < 11.5 ? 'bad' : (v < 12.2 || v > 14.9) ? 'warn' : ''],
  throttle: [0, 100, 0, () => ''],
};
const ALERTS = [
  ['coolant', v => v >= 110, v => v < 104, 'Attention, surchauffe moteur. Je vous recommande de vous arrêter.'],
  ['coolant', v => v >= 102, v => v < 98, 'La température moteur est élevée.'],
  ['fuel', v => v <= 15, v => v > 20, 'Niveau de carburant bas. Pensez à faire le plein.'],
  ['fuel', v => v <= 7, v => v > 10, 'Réserve de carburant critique.'],
  ['voltage', v => v < 11.5, v => v > 12.2, 'Tension batterie anormalement basse.'],
  ['rpm', v => v >= REDLINE, v => v < REDLINE - 800, 'Régime moteur dans la zone rouge.'],
].map(a => ({ f: a[0], on: a[1], off: a[2], msg: a[3], active: false }));
let warmAnnounced = false;

function checkAlerts() {
  for (const a of ALERTS) {
    const v = S[a.f]; if (v == null) continue;
    if (!a.active && a.on(v)) { a.active = true; say(a.msg); }
    else if (a.active && a.off(v)) a.active = false;
  }
  if (!warmAnnounced && S.coolant >= 80) { warmAnnounced = true; if (performance.now() - t0 > 20000) say('Moteur à température de fonctionnement.'); }
}

function statusReport() {
  if (!live) return say('Aucune liaison avec le véhicule.');
  const p = [];
  if (S.fuel != null) p.push(`carburant ${Math.round(S.fuel)} pour cent`);
  if (S.coolant != null) p.push(`moteur à ${Math.round(S.coolant)} degrés`);
  if (S.voltage != null) p.push(`batterie ${S.voltage.toFixed(1).replace('.', ',')} volts`);
  const pb = ALERTS.some(a => a.active);
  say((pb ? 'Anomalie détectée. ' : 'Tous les systèmes sont opérationnels. ') + p.join(', ') + '.');
}
$('gauge').onclick = statusReport;

// ---------- rendu
function render() {
  const k = 0.18;
  shown.speed += ((live && S.speed || 0) - shown.speed) * k;
  shown.rpm += ((live && S.rpm || 0) - shown.rpm) * k;
  $('spd').textContent = live && S.speed != null ? Math.round(shown.speed) : '--';
  $('spdArc').setAttribute('stroke-dasharray', Math.min(100, shown.speed / VMAX * 100).toFixed(2) + ' 100');
  $('rpmArc').setAttribute('stroke-dasharray', Math.min(100, shown.rpm / RPMMAX * 100).toFixed(2) + ' 100');
  $('rpmArc').setAttribute('stroke', shown.rpm >= REDLINE ? '#ff3b4e' : '#4fe3ff');
  $('rpmTxt').textContent = (live && S.rpm != null ? Math.round(shown.rpm / 10) * 10 : '----') + ' TR/MIN';
  $('gear').textContent = live && S.gear != null ? S.gear : '';
  for (const f in PANELS) {
    const [mn, mx, dec, lvl] = PANELS[f], el = $('p-' + f), v = live ? S[f] : null;
    el.querySelector('.val span').textContent = v == null ? '--' : (+v).toFixed(dec);
    el.querySelector('.bar b').style.width = v == null ? '0' : Math.max(0, Math.min(100, (v - mn) / (mx - mn) * 100)) + '%';
    el.className = 'panel ' + (v == null ? '' : lvl(v));
  }
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (started) { const s = Math.floor((performance.now() - t0) / 1000); $('trip').textContent = 'TRAJET ' + new Date(s * 1000).toISOString().substr(11, 8); }
  if (started && live) checkAlerts();
  requestAnimationFrame(render);
}

// ---------- liaison
function setLink(cls, txt) { $('link').className = cls; $('linktxt').textContent = txt; }
let wasLive = false;
function onCar(d) { // appelé par le WebSocket ou par l'appli Android
  S = d;
  live = S.age < 3; // données fraîches du véhicule
  setLink(live ? 'ok' : '', live ? 'LIAISON ' + String(S.source).toUpperCase() : (S.link || 'VÉHICULE MUET'));
  if (started && wasLive && !live) say('Liaison avec le véhicule perdue.');
  wasLive = live;
}
if (NATIVE) $('link').onclick = () => Android.pickDevice();
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = e => onCar(JSON.parse(e.data));
  ws.onclose = () => { live = false; setLink('', 'HORS LIGNE'); setTimeout(connect, 2000); };
}
function demo() {
  setLink('demo', 'DÉMO'); live = true;
  setInterval(() => {
    const t = performance.now() / 1000, sp = Math.max(0, 70 + 60 * Math.sin(t / 7) + 10 * Math.sin(t / 1.7));
    const g = sp < 2 ? 0 : Math.min(6, 1 + Math.floor(sp / 22));
    S = { speed: sp, rpm: g ? Math.max(900, sp * [0, 125, 70, 46, 34, 27, 22][g]) : 820, gear: g || 'N',
      coolant: 89 + 2 * Math.sin(t / 9), intake: 26, load: 40 + 30 * Math.sin(t / 7), fuel: 62,
      voltage: 14.1, throttle: 35 + 30 * Math.cos(t / 7) };
  }, 50);
}

// ---------- démarrage (un toucher est requis par le navigateur pour autoriser la voix)
function boot() {
  if (started) return;
  started = true; t0 = performance.now(); $('boot').classList.add('gone');
  if (!Q.has('nofs') && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  const h = new Date().getHours();
  say((h >= 18 || h < 5 ? 'Bonsoir' : 'Bonjour') + ' monsieur. Systèmes en ligne.');
  setTimeout(statusReport, 3500);
}
$('boot').onclick = boot;
if (Q.has('autostart')) boot();
if (DEMO) demo(); else if (!NATIVE) connect();
render();
</script>
</body>
</html>
